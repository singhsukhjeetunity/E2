name: Release E2 Gotobi
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-gotobi.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and existing systems
        run: |
          python3 tests/gotobi/run_checks.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/run_compression.py
          python3 tests/run_ema_runtime.py
          python3 tests/run_ema_warmup.py
          python3 tests/run_ema_entry.py
          python3 tests/run_gold_clock.py
          g++ -std=c++17 -Wall -Wextra -Werror tests/ema_core.cpp -o /tmp/ema-core
          /tmp/ema-core
          g++ -std=c++17 tests/entry_lifecycle.cpp -o /tmp/entry-lifecycle
          /tmp/entry-lifecycle
          g++ -std=c++17 -Wall -Wextra -Werror tests/report_folders.cpp -o /tmp/report-folders
          /tmp/report-folders
      - name: Package Gotobi source and preset
        run: python3 tools/package_gotobi.py --output dist/E2-Gotobi-v1.14-source.zip
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create E2-Gotobi-v1.14 dist/E2-Gotobi-v1.14-source.zip --target "$GITHUB_SHA" --title "E2 Gotobi v1.14 — fourth EA" --notes-file docs/RELEASE_E2_GOTOBI.md --latest
