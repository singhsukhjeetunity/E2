name: E2 strategy and export checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined,address -g tests/ema_core.cpp -o /tmp/ema-core
      - run: /tmp/ema-core
      - run: g++ -std=c++17 tests/entry_lifecycle.cpp -o /tmp/entry-lifecycle
      - run: /tmp/entry-lifecycle
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/report_folders.cpp -o /tmp/report-folders
      - run: /tmp/report-folders
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/portfolio_gate.cpp -o /tmp/portfolio-gate
      - run: /tmp/portfolio-gate
      - run: python3 tests/run_gold_clock.py
      - run: python3 tests/run_gold_regime.py
      - run: python3 tests/gotobi/run_checks.py
      - run: python3 tests/run_compression.py
      - run: python3 tests/run_nq_orb_clock.py
      - run: python3 tests/run_two_day_reversal.py
