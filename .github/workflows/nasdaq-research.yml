name: Nasdaq research checks
on:
  push:
    branches: [research/nasdaq-nr4-ema]
    paths: ['research/NasdaqPair/**', '.github/workflows/nasdaq-research.yml']
  pull_request:
    paths: ['research/NasdaqPair/**', '.github/workflows/nasdaq-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-core-and-reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile shared signal and clock test harness
        run: g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=undefined,address -g research/NasdaqPair/tests/core_test.cpp -o /tmp/nasdaq-core
      - name: Test shared signal and clock logic
        run: /tmp/nasdaq-core
      - name: Test ledger analysis
        run: python3 -m unittest discover -s research/NasdaqPair/tests -p 'test_*.py' -v
      - name: State validation boundary
        run: echo "MQL5 compilation and Strategy Tester execution must be verified in MetaEditor/MT5."
